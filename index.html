
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#260817">
<title>FOULARA SCARF</title>

<style>
:root {
  --wine: #260817;
  --wine2: #421027;
  --pink: #e60068;
  --gold: #d9b875;
  --cream: #fff8ed;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  font-family: Georgia, 'Times New Roman', serif;
  color: var(--cream);
  background:
    radial-gradient(ellipse at 50% 15%, #67213f 0%, transparent 48%),
    linear-gradient(145deg, #16040e, #351025 55%, #19050f);
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 35px 16px;
  overflow-x: hidden;
}

.container {
  width: 100%;
  max-width: 470px;
  text-align: center;
  position: relative;
  z-index: 1;
}

.top-line {
  width: 90px;
  height: 2px;
  background: var(--gold);
  margin: 0 auto 28px;
}

.logo-frame {
  background: linear-gradient(135deg,#fffaf2,#ead9c6);
  border: 1px solid var(--gold);
  border-radius: 18px;
  padding: 17px 12px;
  box-shadow: 0 12px 45px #0007;
  margin-bottom: 25px;
}

.logo-frame img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: contain;
}

.brand {
  font-size: 27px;
  letter-spacing: 5px;
  font-weight: bold;
  color: var(--cream);
  margin: 12px 0 8px;
}

.slogan {
  font-size: 18px;
  font-style: italic;
  letter-spacing: 1.5px;
  color: var(--gold);
  margin-bottom: 30px;
}

.ornament {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin: 25px 0;
  color: var(--gold);
  font-size: 17px;
}

.ornament::before,
.ornament::after {
  content: "";
  height: 1px;
  width: 65px;
  background: linear-gradient(90deg,transparent,var(--gold));
}

.ornament::after {
  transform: rotate(180deg);
}

.follow {
  color: var(--gold);
  font-family: Arial, sans-serif;
  font-size: 12px;
  letter-spacing: 5px;
  margin: 25px 0 20px;
}

.links {
  display: flex;
  flex-direction: column;
  gap: 14px;
}

.social {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 15px;
  min-height: 62px;
  border-radius: 12px;
  text-decoration: none;
  color: white;
  font-family: Arial, sans-serif;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1px;
  border: 1px solid #ffffff30;
  background: linear-gradient(110deg,#ffffff13,#ffffff05);
  box-shadow: 0 5px 18px #0003;
  transition: .3s ease;
}

.social:hover {
  transform: translateY(-4px);
  border-color: var(--gold);
  background: #ffffff18;
  box-shadow: 0 8px 25px #0006;
}

.social svg {
  width: 25px;
  height: 25px;
  fill: currentColor;
}

.facebook { color: #82aaff; }
.instagram { color: #ff85bd; }
.tiktok { color: white; }
.whatsapp { color: #72dfa0; }

.footer {
  margin-top: 38px;
  font-family: Arial, sans-serif;
  font-size: 11px;
  letter-spacing: 2px;
  color: #c7a8b6;
}

.footer span { color: var(--gold); }

@media(max-width:400px) {
  .brand { font-size: 22px; }
  .slogan { font-size: 16px; }
}
</style>
</head>
