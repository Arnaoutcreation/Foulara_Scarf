
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FOULARA SCARF</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 35px 15px;
            font-family: Georgia, serif;
            text-align: center;
            color: #fff8ed;
            background:
                radial-gradient(circle at 15% 15%, rgba(190, 100, 120, 0.22), transparent 30%),
                radial-gradient(circle at 85% 80%, rgba(218, 174, 110, 0.15), transparent 30%),
                linear-gradient(135deg, #4b1025, #741d3b, #3d0b20);
            position: relative;
            overflow-x: hidden;
        }

        body::before,
        body::after {
            content: "✿";
            position: fixed;
            color: rgba(232, 196, 135, 0.15);
            font-size: 170px;
            pointer-events: none;
        }

        body::before {
            top: 5%;
            left: -35px;
        }

        body::after {
            bottom: 3%;
            right: -35px;
        }

        .container {
            width: 100%;
            max-width: 430px;
            position: relative;
            z-index: 1;
        }

        /* إطار اللوغو */
        .logo {
            width: 140px;
            height: 140px;
            max-width: 60vw;
            margin: 0 auto 20px;
            padding: 12px;
            background: linear-gradient(145deg, #fff8ed, #e8d5bb);
            border: 2px solid #d6b477;
            border-radius: 20px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        h1 {
            font-size: 29px;
            letter-spacing: 4px;
            color: #f1d5a5;
            margin-bottom: 7px;
        }

        /* الكتابة تحت اللوغو */
        .slogan {
            font-size: 14px;
            letter-spacing: 1px;
            color: #f8e8d2;
            margin-bottom: 15px;
        }

        .decoration {
            color: #d8b77d;
            font-size: 19px;
            margin-bottom: 15px;
        }

        .follow {
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 3px;
            color: #e8c487;
            margin-bottom: 20px;
        }

        /* أزرار التواصل */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 12px;
            width: 100%;
        }

        .social {
            min-height: 54px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 10px 18px;
            border: 1px solid rgba(232, 196, 135, 0.75);
            border-radius: 15px;
            background: rgba(255, 248, 237, 0.09);
            color: #fff8ed;
            text-decoration: none;
            font-family: Arial, sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            transition: all 0.3s ease;
        }

        .social:hover {
            background: #e8c487;
            color: #4b1025;
            transform: translateY(-3px);
            box-shadow: 0 7px 18px rgba(0, 0, 0, 0.2);
        }

        .social svg {
            width: 23px;
            height: 23px;
            fill: currentColor;
            flex-shrink: 0;
        }

        footer {
            margin-top: 28px;
            font-family: Arial, sans-serif;
            font-size: 10px;
            letter-spacing: 1px;
            color: rgba(255, 248, 237, 0.65);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 25px;
                letter-spacing: 3px;
            }

            .logo {
                width: 140px;
                height: 140px;
            }

            .social {
                min-height: 50px;
                font-size: 12px;
            }
        }
    </style>
</head>

<body>
