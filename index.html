<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#74143f">
<title>Foulara Scarf</title>

<style>
:root {
  --wine: #74143f;
  --dark: #4c0d2b;
  --gold: #b58a4a;
  --cream: #f8efe6;
  --paper: #fffaf5;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 24px 15px;
  background: var(--cream);
  font-family: Georgia, serif;
}

.card {
  width: min(100%, 440px);
  padding: 25px 22px;
  background: var(--paper);
  border: 1px solid #b58a4a;
  border-radius: 27px;
  text-align: center;
  box-shadow: 0 18px 55px #41182a20;
}

.logo {
  width: 100%;
  height: auto;
  border-radius: 16px;
}

h1 {
  color: var(--dark);
  font-size: 35px;
  letter-spacing: 1px;
}

.tag {
  color: #80645a;
  font: 13px Arial;
  letter-spacing: 2px;
  text-transform: uppercase;
}

.rule {
  width: 74px;
  height: 2px;
  background: var(--gold);
  margin: 22px auto;
}

.links {
  display: grid;
  gap: 12px;
}

.links a {
  display: block;
  padding: 17px;
  border-radius: 15px;
  background: var(--wine);
  border: 1px solid var(--gold);
  color: white;
  text-decoration: none;
  font: bold 16px Arial;
  transition: .2s;
}

.links a:hover {
  background: var(--dark);
  transform: translateY(-2px);
}

footer {
  margin-top: 25px;
  color: #967b6c;
  font: 11px Arial;
  letter-spacing: 1px;
}
</style>
</head>

<body>

<main class="card">

<img class="logo" src="logo.jpg"
alt="Foulara Scarf Logo">

<h1>Foulara Scarf</h1>

<p class="tag">Elegance in every wrap</p>

<div class="rule"></div>

<nav class="links">

<a href="https://www.facebook.com/share/1DqoDhgRsc/" target="_blank">
Facebook
</a>

<a href="https://www.instagram.com/foulara.scarf/" target="_blank">
Instagram
</a>

<a href="https://www.tiktok.com/@foulara.scarf" target="_blank">
TikTok
</a>

<a href="https://wa.me/213658478789" target="_blank">
WhatsApp
</a>

</nav>

<footer>
FOULARA SCARF · CONNECT WITH US
</footer>

</main>

</body>
</html>
