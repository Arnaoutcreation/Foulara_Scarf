
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#4b1025">
<title>FOULARA SCARF</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 35px 15px;
    font-family: Georgia, serif;
    text-align: center;
    color: #fff8ed;
    background:
        radial-gradient(circle at 15% 15%, rgba(190,100,120,.22), transparent 30%),
        radial-gradient(circle at 85% 80%, rgba(218,174,110,.15), transparent 30%),
        linear-gradient(135deg, #4b1025, #741d3b, #3d0b20);
    position: relative;
    overflow-x: hidden;
}

body::before,
body::after {
    content: "✿";
    position: fixed;
    color: rgba(232,196,135,.15);
    font-size: 170px;
    pointer-events: none;
}

body::before {
    top: 5%;
    left: -35px;
}

body::after {
    bottom: 3%;
    right: -35px;
}

.container {
    width: 100%;
    max-width: 430px;
    position: relative;
    z-index: 1;
}

/* LOGO */

.logo {
    width: 210px;
    height: 210px;
    max-width: 72vw;
    margin: 0 auto 17px;
    padding: 13px;
    background: linear-gradient(145deg, #fffaf1, #e8d5bb);
    border: 2px solid #d6b477;
    border-radius: 25px;
    box-shadow:
        0 12px 30px rgba(0,0,0,.35),
        inset 0 2px 5px rgba(255,255,255,.8);
    display: flex;
    align-items: center;
    justify-content: center;
}

.logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
}

/* TITLE */

h1 {
    font-size: 25px;
    letter-spacing: 3px;
    color: #f1d5a5;
    margin-bottom: 5px;
    text-shadow: 0 2px 5px rgba(0,0,0,.3);
}

.slogan {
    font-size: 13px;
    letter-spacing: .8px;
    color: #f8e8d2;
    margin-bottom: 13px;
}

.decoration {
    color: #d8b77d;
    font-size: 19px;
    margin-bottom: 15px;
}

.follow {
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 3px;
    color: #e8c487;
    margin-bottom: 20px;
}

/* SOCIAL BUTTONS */

.social-links {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 330px;
    margin: 0 auto;
}

.social {
    min-height: 62px;
    display: flex;
    align-items: center;
    justify-content: flex-start;
    gap: 17px;
    padding: 10px 20px;

    border: 1px solid #e3c48b;
    border-radius: 20px;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,.19),
            rgba(255,255,255,.04) 45%,
            rgba(0,0,0,.12)
        ),
        linear-gradient(120deg, #721e3d, #501329);

    color: #fff4df;
    text-decoration: none;
    font-family: Arial, sans-serif;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 2px;

    box-shadow:
        0 6px 0 #32101f,
        0 9px 18px rgba(0,0,0,.28),
        inset 0 1px 2px rgba(255,255,255,.35);

    transition: all .25s ease;
    position: relative;
}

/* GOLD ICON CIRCLE */

.icon-box {
    width: 39px;
    height: 39px;
    min-width: 39px;
    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(145deg, #fff1c9, #d6ad64);
    border: 1px solid #f5dfac;

    box-shadow:
        0 3px 7px rgba(0,0,0,.25),
        inset 0 2px 3px rgba(255,255,255,.8);

    color: #52142b;
}

.icon-box svg {
    width: 23px;
    height: 23px;
    display: block;
    fill: currentColor;
}

/* BUTTON HOVER */

.social:hover {
    transform: translateY(-3px);
    background: linear-gradient(145deg, #f4dfb7, #d6ad64);
    color: #4b1025;

    box-shadow:
        0 8px 0 #9a7541,
        0 12px 22px rgba(0,0,0,.3),
        inset 0 2px 4px rgba(255,255,255,.8);
}

.social:hover .icon-box {
    background: linear-gradient(145deg, #741d3b, #4b1025);
    color: #fff1c9;
    border-color: #741d3b;
}

.social:active {
    transform: translateY(3px);
    box-shadow:
        0 2px 0 #32101f,
        0 4px 8px rgba(0,0,0,.2);
}

/* FOOTER */

footer {
    margin-top: 30px;
    font-family: Arial, sans-serif;
    font-size: 10px;
    letter-spacing: 1px;
    color: rgba(255,248,237,.65);
}

/* MOBILE */

@media (max-width: 600px) {
    .logo {
        width: 190px;
        height: 190px;
    }

    .social-links {
        max-width: 310px;
        gap: 14px;
    }

    .social {
        min-height: 59px;
        font-size: 12px;
    }

    h1 {
        font-size: 24px;
    }
}

@media (prefers-reduced-motion: reduce) {
    .social {
        transition: none;
    }
}
</style>
</head>
